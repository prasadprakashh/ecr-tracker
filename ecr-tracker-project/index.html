<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ECR Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ECR Tracker</h1>
    <div class="controls">
        <button onclick="addRow()">Add ECR</button>
        <button onclick="exportCSV()">Export CSV</button>
        <input type="file" id="csvInput" onchange="importCSV(event)">
    </div>

    <table id="ecrTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Owner</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
